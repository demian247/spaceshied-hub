name: Keep Supabase awake

# Supabase 무료 플랜은 7일간 활동이 없으면 프로젝트가 일시정지됩니다.
# 이 워크플로가 매일 DB에 쿼리를 보내 활동을 발생시켜 정지를 막습니다.
# (매일 = 7일 창에 6일치 여유. GitHub 스케줄이 며칠 지연·누락돼도 절대 7일을 안 넘김.)

on:
  schedule:
    - cron: "0 3 * * *"        # 매일 03:00 UTC (한국시간 12:00)
    - cron: "0 15 * * *"       # 매일 15:00 UTC (한국시간 24:00) — 하루 2회로 누락 대비
  workflow_dispatch:           # 수동 실행 버튼 (테스트용)

permissions:
  contents: write              # 하트비트 커밋용

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase (DB 쿼리로 활동 발생)
        run: |
          URL="https://tnuzqrqxptxrfozzjjek.supabase.co"
          # publishable(공개용) 키 — 프론트 코드에도 들어있는 공개 키라 유출 아님.
          KEY="sb_publishable_BSLM7lCKgpZWRtweb687og_F1RqFAYN"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$URL/rest/v1/products?select=id&limit=1" \
            -H "apikey: $KEY")
          echo "Supabase 응답: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase ping 실패 (HTTP $code) — 프로젝트가 이미 정지됐거나 키/URL 문제일 수 있음"
            exit 1
          fi

      - name: Heartbeat commit (스케줄 워크플로 60일 자동비활성화 방지)
        run: |
          # GitHub 은 60일간 저장소 활동(커밋)이 없으면 스케줄 워크플로를 끕니다.
          # 날짜만 기록 → 하루 2회 실행돼도 커밋은 하루 1회만 발생(내용 안 바뀌면 커밋 생략).
          date -u +"%Y-%m-%d  (Supabase keep-alive OK)" > keepalive.txt
          git config user.name "keepalive-bot"
          git config user.email "actions@github.com"
          git add keepalive.txt
          git diff --cached --quiet && { echo "오늘 이미 하트비트 있음 — 커밋 생략"; exit 0; }
          git commit -m "keepalive $(date -u +%F) [skip ci]"
          git push
