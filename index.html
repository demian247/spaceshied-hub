<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPACE SHIELD · 회사 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17181a; --paper:#f4f4f1; --card:#fff;
  --line:#e2e1dc; --line-strong:#c9c8c2; --muted:#83837d;
  --tag:#f0b429; --tag-soft:#fdf3d7;
  --ok:#2e7d4f; --ok-soft:#e8f3ec;
  --blue:#2b5f9e; --blue-soft:#e9f0f8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:14px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
.mono{font-family:'IBM Plex Mono',monospace}

/* ── 헤더 ── */
header{background:var(--ink);color:#fff;padding:0 24px}
.hd-top{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 0;flex-wrap:wrap}
.brand{font-family:'Archivo',sans-serif;font-variation-settings:'wdth' 118;font-weight:800;font-size:20px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.brand small{display:block;font-family:'Noto Sans KR';font-weight:400;font-size:11px;letter-spacing:.28em;color:#b9b9b3;margin-top:-2px}
.hd-sp{flex:1}
.hd-note{color:#b9b9b3;font-size:12px;white-space:nowrap}

/* ── 히어로 ── */
.hero{max-width:960px;margin:0 auto;padding:44px 24px 8px;width:100%}
.hero h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.hero h1 .accent{background:var(--tag);padding:1px 8px;border-radius:6px}
.hero p{color:var(--muted);margin-top:8px;font-size:14.5px}

/* ── 도구 카드 ── */
.grid{max-width:960px;margin:0 auto;width:100%;padding:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:16px}
.tool{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .15s,transform .15s,border-color .15s;position:relative;cursor:pointer}
.tool:hover{border-color:var(--line-strong);box-shadow:0 6px 20px rgba(23,24,26,.09);transform:translateY(-2px)}
.tool .num{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.1em}
.tool h2{font-size:17.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.tool h2 .ico{font-size:20px}
.tool .desc{color:var(--muted);font-size:13px;flex:1}
.tool .go{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;align-self:flex-start}
.tool:hover .go{background:#000}
.tool .go .arr{transition:transform .15s}
.tool:hover .go .arr{transform:translateX(3px)}
.tool .repo{position:absolute;top:18px;right:18px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--paper)}
.tool .repo:hover{border-color:var(--line-strong);color:var(--ink)}
.tool.soon{opacity:.55}
.tool.soon .go{background:var(--muted)}

/* ── 하단 안내 ── */
.foot-note{max-width:960px;margin:0 auto;width:100%;padding:4px 24px 32px}
.note-bar{background:var(--tag-soft);border:1px solid #ecd9a0;border-radius:10px;padding:12px 16px;font-size:12.5px;color:#6b5200}
.note-bar a{font-weight:600;text-decoration:underline}
footer{margin-top:auto;border-top:1px solid var(--line);padding:16px 24px;text-align:center;color:var(--muted);font-size:12px}
footer a{text-decoration:underline}

@media (max-width:640px){
  .hero{padding-top:32px}
  .hero h1{font-size:20px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="hd-top">
    <div class="brand">Space Shield<small>회사 관리 허브</small></div>
    <div class="hd-sp"></div>
    <div class="hd-note mono" id="today"></div>
  </div>
</header>

<div class="hero">
  <h1><span class="accent">회사 관리</span> — 도구 한 곳에서 열기</h1>
  <p>흩어진 관리 도구를 하나의 허브로 묶었습니다. 카드를 누르면 각 도구가 새 탭으로 열립니다.</p>
</div>

<main class="grid" id="grid"></main>

<footer>
  SPACE SHIELD 내부 관리용 ·
  <a href="https://github.com/heyjyu/spaceshied-hub" target="_blank" rel="noopener">GitHub</a>
</footer>

<script>
// 도구 추가는 이 배열에 한 항목만 추가하면 됨
const TOOLS = [
  {
    num: '01',
    ico: '🛒',
    name: '쿠팡 상품 관리',
    desc: '쿠팡 상품 등록·수정·운영 현황을 관리하는 도구.',
    url: 'https://heyjyu.github.io/coupang-ops/',
    repo: 'coupang-ops',
  },
  {
    num: '02',
    ico: '📦',
    name: '포장 운영 관리',
    desc: '포장재 품목 카드·발주 칸반·재고를 통합 관리하는 패키지 관리대장.',
    url: 'https://heyjyu.github.io/spaceshield-packaging/',
    repo: 'spaceshield-packaging',
  },
  {
    num: '03',
    ico: '🗂️',
    name: '상품 카테고리',
    desc: '워치 스트랩 전 상품 검색·필터·상세 조회 카탈로그.',
    url: 'https://heyjyu.github.io/spaceshied-catalog/',
    repo: 'spaceshied-catalog',
  },
];

const grid = document.getElementById('grid');
grid.innerHTML = TOOLS.map((t, i) => `
  <div class="tool${t.soon ? ' soon' : ''}" data-i="${i}" role="link" tabindex="0"
       aria-label="${t.name} 열기">
    <span class="num">${t.num}</span>
    <a class="repo mono" href="https://github.com/heyjyu/${t.repo}" target="_blank" rel="noopener">${t.repo}</a>
    <h2><span class="ico">${t.ico}</span>${t.name}</h2>
    <p class="desc">${t.desc}</p>
    <span class="go">열기 <span class="arr">→</span></span>
  </div>
`).join('');

grid.addEventListener('click', e => {
  if (e.target.closest('.repo')) return;
  const card = e.target.closest('.tool');
  if (card) window.open(TOOLS[card.dataset.i].url, '_blank', 'noopener');
});
grid.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const card = e.target.closest('.tool');
  if (card) window.open(TOOLS[card.dataset.i].url, '_blank', 'noopener');
});

const d = new Date();
document.getElementById('today').textContent =
  `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
</script>

</body>
</html>
